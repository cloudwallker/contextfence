<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img" aria-labelledby="title desc">
  <title id="title">ContextFence: validate before serving context</title>
  <desc id="desc">A source writer sends a complete snapshot through instance B using an exclusive tenant guard lock. Instance A acquires a shared tenant guard lock and checks current PostgreSQL source permissions, versions, epochs and expiry before accessing immutable cached bodies. Source and derived context preserve bound leaf dependencies. Transactions commit before HTTP results are returned.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#64748b"/></marker>
  </defs>
  <rect width="1200" height="730" rx="22" fill="#f8fafc"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="44" y="56" font-size="30" font-weight="700" fill="#0f172a">ContextFence</text>
    <text x="44" y="87" font-size="18" fill="#475569">Validate current source state before serving managed context.</text>

    <rect x="44" y="126" width="265" height="104" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="66" y="160" font-size="20" font-weight="600" fill="#0f172a">Trusted source writer</text>
    <text x="66" y="190" font-size="16" fill="#475569">Complete snapshot + sequence</text>
    <text x="66" y="212" font-size="16" fill="#475569">Content, readers, state, freshness</text>

    <rect x="400" y="126" width="315" height="104" rx="14" fill="#eef2ff" stroke="#a5b4fc"/>
    <text x="422" y="160" font-size="20" font-weight="600" fill="#312e81">Instance B · source update</text>
    <text x="422" y="190" font-size="16" fill="#4338ca">Tenant guard: FOR UPDATE</text>
    <text x="422" y="212" font-size="16" fill="#4338ca">Atomic state + event result</text>

    <rect x="830" y="126" width="326" height="316" rx="14" fill="#e0f2fe" stroke="#7dd3fc"/>
    <text x="852" y="164" font-size="21" font-weight="600" fill="#0c4a6e">PostgreSQL primary</text>
    <text x="852" y="198" font-size="16" fill="#075985">Current source permissions</text>
    <text x="852" y="226" font-size="16" fill="#075985">content_version + auth_epoch</text>
    <text x="852" y="254" font-size="16" fill="#075985">State + expiry + freshness</text>
    <path d="M852 275H1134" stroke="#7dd3fc"/>
    <text x="852" y="310" font-size="17" font-weight="600" fill="#0c4a6e">One tenant guard row</text>
    <text x="852" y="338" font-size="16" fill="#075985">Shared reads / exclusive writes</text>
    <text x="852" y="384" font-size="16" fill="#075985">Body-free decision receipts</text>
    <text x="852" y="412" font-size="16" fill="#075985">Database unavailable → 503</text>

    <rect x="44" y="330" width="265" height="158" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="66" y="365" font-size="20" font-weight="600" fill="#0f172a">Managed context</text>
    <text x="66" y="397" font-size="16" fill="#475569">Source → child → grandchild</text>
    <text x="66" y="425" font-size="16" fill="#475569">Inherited leaf dependencies</text>
    <text x="66" y="453" font-size="16" fill="#475569">Bound version + epoch</text>
    <text x="66" y="477" font-size="16" fill="#475569">Earliest parent expiry</text>

    <rect x="400" y="330" width="315" height="158" rx="14" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text x="422" y="365" font-size="20" font-weight="600" fill="#064e3b">Instance A · assemble</text>
    <text x="422" y="397" font-size="16" fill="#065f46">Tenant guard: FOR SHARE</text>
    <text x="422" y="425" font-size="16" fill="#065f46">Fresh SQL after lock acquisition</text>
    <text x="422" y="453" font-size="16" fill="#065f46">Database time for expiry</text>
    <text x="422" y="477" font-size="16" fill="#065f46">Validate every item and source</text>

    <rect x="830" y="496" width="326" height="100" rx="14" fill="#fff7ed" stroke="#fdba74"/>
    <text x="852" y="531" font-size="20" font-weight="600" fill="#7c2d12">Immutable body cache</text>
    <text x="852" y="559" font-size="16" fill="#9a3412">Per instance · bodies only</text>
    <text x="852" y="582" font-size="16" fill="#9a3412">No permission decisions cached</text>

    <path d="M309 178H400" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
    <path d="M715 178H830" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
    <path d="M309 409H400" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
    <path d="M715 385H830" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
    <path d="M660 488V546H830" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
    <text x="688" y="533" font-size="15" fill="#475569">If all pass</text>

    <rect x="400" y="637" width="756" height="61" rx="13" fill="#0f172a"/>
    <path d="M500 488V637" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
    <text x="520" y="591" font-size="16" fill="#475569">Commit before HTTP</text>
    <text x="422" y="674" font-size="18" fill="#ffffff">Allowed: bounded bodies  ·  Denied: no bodies  ·  Every retrieval rechecks</text>
    <text x="44" y="670" font-size="15" fill="#475569">Architecture diagram</text>
    <text x="44" y="692" font-size="15" fill="#475569">Not a runtime screenshot</text>
  </g>
</svg>
