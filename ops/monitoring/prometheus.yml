global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files: [/etc/prometheus/alerts.yml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: contextfence
    metrics_path: /actuator/prometheus
    authorization:
      type: Bearer
      credentials_file: /runtime/scrape-token
    static_configs:
      - targets: [api-a:8080, api-b:8080]
    relabel_configs:
      - source_labels: [__address__]
        regex: '(api-[ab]):8080'
        target_label: instance
        replacement: '$1'
  - job_name: postgres
    static_configs: [{targets: [postgres-exporter:9187]}]
  - job_name: host
    static_configs: [{targets: [node-exporter:9100]}]
  - job_name: haproxy
    static_configs: [{targets: [proxy:8404]}]
  - job_name: prometheus
    static_configs: [{targets: [localhost:9090]}]
