global
    log stdout format raw local0
    maxconn 2048
    # The local proxy has a 0.15 CPU quota; do not inherit every host CPU as a worker thread.
    nbthread 1
    lua-load /usr/local/etc/haproxy/gate.lua
    stats socket /tmp/haproxy.sock mode 600 level admin

defaults
    log global
    mode http
    timeout connect 3s
    timeout client 20s
    timeout server 20s
    timeout queue 8s
    option http-server-close
    # No raw request-line logs: query strings and credentials stay out of proxy logs.
    log-format '{"component":"haproxy","status":%ST,"backend":"%b","server":"%s","elapsed_ms":%Tt}'

resolvers docker
    nameserver docker 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s

frontend business
    bind :8080
    acl gate_open lua.proxy_gate_open -m bool
    http-request return status 503 content-type application/json string '{"code":"MAINTENANCE"}' hdr Cache-Control no-store unless gate_open
    http-request deny deny_status 404 if { path_beg /actuator }
    default_backend contextfence

backend contextfence
    balance roundrobin
    option httpchk
    http-check send meth GET uri /health/ready ver HTTP/1.1 hdr Host contextfence
    http-check expect status 200
    default-server check inter 3s fastinter 1s downinter 2s fall 2 rise 2 resolvers docker init-addr libc,none
    # Restart cannot undo a candidate drain: controlled smoke explicitly enables servers.
    server api-a api-a:8080 disabled
    server api-b api-b:8080 disabled

frontend internal_metrics
    bind :8404
    http-request use-service prometheus-exporter if { path /metrics }
    http-request deny deny_status 404
