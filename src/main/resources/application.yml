server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false
    whitelabel:
      enabled: false

spring:
  application:
    name: context-fence
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${CONTEXTFENCE_DATABASE_URL:jdbc:postgresql://localhost:5432/contextfence}
    username: ${CONTEXTFENCE_DATABASE_USER:contextfence}
    password: ${CONTEXTFENCE_DATABASE_PASSWORD:}
    hikari:
      pool-name: contextfence
      maximum-pool-size: 16
      minimum-idle: 2
      connection-timeout: 2000
      data-source-properties:
        socketTimeout: 3
        ApplicationName: context-fence
  flyway:
    validate-on-migrate: true
    clean-disabled: true
  mvc:
    log-request-details: false
  web:
    resources:
      add-mappings: false

logging:
  structured:
    format:
      console: logstash
  level:
    org.springframework.jdbc.core: OFF
    org.springframework.web: ERROR
    org.springframework.security: WARN
    com.zaxxer.hikari: WARN

contextfence:
  observability:
    instance: ${CONTEXTFENCE_INSTANCE:local}
    version: ${CONTEXTFENCE_VERSION:0.1.0}

management:
  endpoints:
    web:
      exposure:
        include: prometheus
  metrics:
    use-global-registry: false
    distribution:
      percentiles-histogram:
        http.server.requests: true
      minimum-expected-value:
        http.server.requests: 1ms
      maximum-expected-value:
        http.server.requests: 10s
      slo:
        http.server.requests: 5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,2s,5s
